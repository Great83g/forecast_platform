{% extends "dashboard/base.html" %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h3 class="card-title mb-3">Solar Super Calculator</h3>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Режим</label>
        <select id="mode" class="form-select">
          <option value="consumption">По потреблению</option>
          <option value="appliances">По приборам</option>
          <option value="budget">По бюджету</option>
          <option value="roof_area">По площади крыши</option>
          <option value="max_roof">Максимум на крышу</option>
          <option value="utility_power">Utility по мощности</option>
          <option value="utility_land">Utility по земле</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Тариф (тг/кВт·ч)</label>
        <input id="tariff" type="number" step="0.1" class="form-control" value="35">
      </div>
      <div class="col-md-4">
        <label class="form-label">Specific Yield (кВт·ч/кВт/год)</label>
        <input id="specific_yield" type="number" class="form-control" value="1450">
      </div>
      <div class="col-md-6">
        <label class="form-label">Значение режима</label>
        <input id="primary_value" type="number" class="form-control" value="900"/>
        <div class="form-text">monthly_kwh / budget / roof_area / target_mw / land_hectares</div>
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <button class="btn btn-primary w-100" id="runCalc">Рассчитать</button>
      </div>
    </div>

    <hr class="my-4" />
    <h5>Результат</h5>
    <pre id="result" class="bg-light p-3 rounded small">Нажмите «Рассчитать»</pre>
  </div>
</div>

<script>
  document.getElementById('runCalc').addEventListener('click', async () => {
    const mode = document.getElementById('mode').value;
    const value = parseFloat(document.getElementById('primary_value').value || '0');
    const tariff = parseFloat(document.getElementById('tariff').value || '0');
    const specificYield = parseFloat(document.getElementById('specific_yield').value || '1450');

    const inputs = { tariff: tariff, specific_yield: specificYield };
    if (mode === 'consumption') inputs.monthly_kwh = value;
    if (mode === 'budget') inputs.budget = value;
    if (mode === 'roof_area' || mode === 'max_roof') inputs.roof_area = value;
    if (mode === 'utility_power') inputs.target_mw = value;
    if (mode === 'utility_land') inputs.land_hectares = value;
    if (mode === 'appliances') {
      inputs.appliances = [
        { name: 'Pump', power_kw: 1.5, hours_per_day: 6, quantity: 1, simultaneity_factor: 0.8 },
        { name: 'Lights', power_kw: 0.2, hours_per_day: 8, quantity: 10, simultaneity_factor: 0.7 },
      ];
    }

    const response = await fetch('{% url "solar_calculator:calculate" %}', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': '{{ csrf_token }}',
      },
      body: JSON.stringify({ mode: mode, inputs: inputs }),
    });
    const data = await response.json();
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
  });
</script>
{% endblock %}
