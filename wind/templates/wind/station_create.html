{% extends "dashboard/base.html" %}

{% block title %}Новая ветростанция{% endblock %}

{% block content %}
<div class="container mt-4">
  <h3 class="mb-3">Создать ветростанцию</h3>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <h5 class="mb-2">Основные данные</h5>
        {{ station_form.as_p }}

        <hr>
        <h5 class="mb-2">Параметры турбин</h5>
        {{ profile_form.as_p }}

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Сохранить</button>
          <a href="{% url 'wind:station-list' %}" class="btn btn-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
